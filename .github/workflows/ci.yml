name: CI

on:
  push:
    branches: [main, public-v2]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pip-audit
      - name: Format
        working-directory: backend
        run: |
          black --check abuse_controls.py admin_cli.py assistant api auth.py \
            bot.py config.py domain inline_staging_worker.py main.py \
            observability.py public_models.py \
            telegram_commands.py utils.py worker.py tests/test_abuse_controls.py \
            tests/test_free_staging_profile.py tests/test_inline_staging_worker.py \
            tests/test_security_boundary.py
      - name: Lint
        working-directory: backend
        run: |
          flake8 abuse_controls.py admin_cli.py assistant inline_staging_worker.py \
            observability.py worker.py \
            --max-line-length=88 --extend-ignore=E203,W503
      - name: Unit and integration tests
        working-directory: backend
        env:
          DEBUG: "false"
        run: pytest -q
      - name: Python dependency audit
        working-directory: backend
        run: pip-audit -r requirements.txt
      - name: Python security scan
        # B104 is expected: the API must bind the container interface, while
        # Render provides the public TLS boundary.
        run: bandit -r backend -x backend/tests,backend/migrations,backend/venv,backend/data,backend/test_data,backend/test_backups -s B104 -ll -q

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pr_agent_test
          POSTGRES_USER: pr_agent_test
          POSTGRES_PASSWORD: pr_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pr_agent_test -d pr_agent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Upgrade, verify, downgrade, and re-upgrade
        working-directory: backend
        env:
          APP_ENV: test
          DATABASE_URL: postgresql://unused:unused@localhost/unused
          TEST_DATABASE_URL: postgresql://pr_agent_test:pr_agent_test@localhost:5432/pr_agent_test
          DEBUG: "false"
        run: |
          python -m alembic upgrade head
          python -m alembic check
          POSTGRES_TEST_URL="$TEST_DATABASE_URL" pytest -q tests/test_postgres_schema.py
          python -m alembic downgrade base
          python -m alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          version: 10.11.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Static checks and unit tests
        working-directory: frontend
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
      - name: JavaScript production dependency audit
        working-directory: frontend
        run: pnpm audit --prod --audit-level high
      - name: Browser tests
        working-directory: frontend
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e

  containers:
    needs: [backend, migrations, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: backend
          push: false
          tags: pr-agent-backend:ci
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: frontend
          push: false
          tags: pr-agent-frontend:ci
          build-args: NEXT_PUBLIC_API_URL=http://localhost:8000
