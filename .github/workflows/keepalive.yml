name: Keep API awake

# The in-process self-ping in backend/keep_alive.py keeps the API awake while
# it is running. It cannot wake a service that already slept, because nothing
# is running to send the request. This workflow covers that case: a redeploy,
# a crash, or any gap where the process was not alive to ping itself.
#
# GitHub only guarantees a best-effort schedule and frequently delays cron runs
# during peak load, so each run pings repeatedly across its own window instead
# of once. GitHub also disables scheduled workflows in repositories with 60
# days of no activity - see docs/KEEP_ALIVE.md for the external backup pinger.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Ping the health endpoint across the schedule window
        env:
          # Override with a repository variable if the service URL changes.
          BASE_URL: ${{ vars.KEEP_ALIVE_URL || 'https://pr-agent-r24-staging-api.onrender.com' }}
        run: |
          set -u
          target="${BASE_URL%/}/health"
          echo "Pinging ${target}"
          failures=0

          for attempt in 1 2 3 4 5; do
            # A cold start on a free instance can take close to a minute, so
            # allow a generous timeout before treating a ping as failed.
            status="$(curl -sS -o /dev/null -w '%{http_code}' \
              --max-time 90 --retry 2 --retry-delay 5 --retry-all-errors \
              -X GET "${target}" || echo "000")"

            if [ "${status}" = "200" ]; then
              echo "attempt ${attempt}: ok (${status})"
            else
              echo "attempt ${attempt}: FAILED (${status})"
              failures=$((failures + 1))
            fi

            if [ "${attempt}" -lt 5 ]; then
              sleep 110
            fi
          done

          echo "Completed with ${failures} failed ping(s)."
          # Fail the run only when every ping failed, so a single blip during a
          # cold start does not create alert noise.
          if [ "${failures}" -ge 5 ]; then
            echo "::error::All keep-alive pings failed. The API may be down."
            exit 1
          fi
