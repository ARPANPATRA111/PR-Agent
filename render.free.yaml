# Free staging only.
# Creates one Free web service and one free static site.
# Does not create a worker, cron job, Render database, disk, or paid resource.
# Scheduled delivery is best-effort while the API is awake.

services:
  - type: web
    name: pr-agent-r24-staging-api
    runtime: docker
    plan: free
    repo: https://github.com/ARPANPATRA111/PR-Agent
    branch: public-v2
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python render_start.py
    healthCheckPath: /ready
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: staging
      - key: APP_BASE_URL
        value: https://pr-agent-r24-staging-api.onrender.com
      - key: FRONTEND_BASE_URL
        value: https://pr-agent-r24-staging-web.onrender.com
      - key: PUBLIC_V2_ENABLED
        value: "true"
      - key: INVITE_ONLY
        value: "false"
      - key: TELEGRAM_INTEGRATION_ENABLED
        value: "true"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: INLINE_STAGING_WORKER_ENABLED
        value: "true"
      # Raised from 15s: the service now stays awake continuously, so a tighter
      # poll only adds constant database load without improving punctuality.
      - key: INLINE_STAGING_POLL_INTERVAL_SECONDS
        value: "30"
      # Keeps the running process from idling out. Render suspends a free web
      # service after ~15 minutes without inbound HTTP traffic.
      - key: KEEP_ALIVE_ENABLED
        value: "true"
      - key: KEEP_ALIVE_INTERVAL_SECONDS
        value: "600"
      - key: REMINDER_WORKER_ENABLED
        value: "false"
      - key: WORKER_BATCH_SIZE
        value: "10"
      - key: MESSAGE_CLEANUP_ENABLED
        value: "true"
      - key: MESSAGE_CLEANUP_DELAY_SECONDS
        value: "144000"
      # Public natural-language usage is capped per Telegram account. Direct
      # slash commands remain available after the daily AI allowance is used.
      - key: QUOTAS_ENABLED
        value: "true"
      - key: PER_USER_DAILY_AI_LIMIT
        # Temporary staging headroom for the current acceptance-test cycle.
        # Restore this to 25 before opening the bot to broader public use.
        value: "100"
      - key: PER_USER_DAILY_NUTRITION_LIMIT
        value: "100"
      - key: PER_USER_DAILY_SUMMARY_LIMIT
        value: "200"
      - key: PER_USER_DAILY_TEXT_LIMIT
        value: "500"
      - key: PER_USER_DAILY_VOICE_MINUTES
        value: "120"
      - key: GLOBAL_DAILY_AI_LIMIT
        value: "20000"
      - key: AI_AGENT_ENABLED
        value: "true"
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      # Optional extra Groq credentials, comma separated, no spaces needed.
      # Requests rotate across every key configured here for traffic
      # distribution and credential failover. Groq's organisation-wide quota
      # still applies. Leave blank until keys are generated, then paste them
      # into the Render dashboard as a masked value.
      - key: GROQ_API_KEYS
        sync: false
      # Backward-compatible names for the two test credentials. They join the
      # same deduplicated round-robin pool as GROQ_API_KEYS and are never
      # returned by an endpoint or written to logs.
      - key: ENV1
        sync: false
      - key: ENV2
        sync: false
      # Public URL of the hosted privacy policy. The bot links it from /start
      # and /privacy. Leave blank until the policy is hosted; the bot then
      # omits the link rather than showing a broken one.
      - key: PRIVACY_POLICY_URL
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_FALLBACK_MODEL
        value: qwen/qwen3.6-27b
      - key: GROQ_REQUEST_TIMEOUT_SECONDS
        value: "30"
      - key: WHISPER_MODEL
        value: whisper-large-v3-turbo
      - key: NUTRITION_PROVIDER
        value: groq
      - key: TELEGRAM_WEBHOOK_URL
        value: https://pr-agent-r24-staging-api.onrender.com/webhook
      - key: TELEGRAM_MINI_APP_URL
        value: https://pr-agent-r24-staging-web.onrender.com
      - key: TELEGRAM_WELCOME_IMAGE_URL
        value: https://pr-agent-r24-staging-web.onrender.com/pr-agent-welcome.png
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SIGNING_SECRET
        generateValue: true
      # Enable only after VAULT_ENCRYPTION_KEYS is set to a generated
      # key_id:base64-32-byte-key value in Render's masked secret store.
      - key: VAULT_ENABLED
        value: "false"
      - key: VAULT_ENCRYPTION_KEYS
        sync: false
      - key: VAULT_RECENT_AUTH_SECONDS
        value: "300"
      - key: INTERNAL_MONITORING_TOKEN
        generateValue: true
      - key: CORS_ORIGINS
        value: https://pr-agent-r24-staging-web.onrender.com
      - key: DEBUG
        value: "false"
      - key: DISABLE_SSL_VERIFY
        value: "false"
      - key: JSON_LOGS
        value: "true"
      - key: TIMEZONE
        value: Asia/Kolkata

  - type: web
    name: pr-agent-r24-staging-web
    runtime: static
    repo: https://github.com/ARPANPATRA111/PR-Agent
    branch: public-v2
    buildCommand: >-
      cd frontend &&
      corepack pnpm install --frozen-lockfile &&
      corepack pnpm build
    staticPublishPath: ./frontend/out
    autoDeployTrigger: commit
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://pr-agent-r24-staging-api.onrender.com
    routes:
      - type: rewrite
        source: /privacy
        destination: /privacy.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: camera=(), geolocation=(), microphone=()
      - path: /*
        name: X-Permitted-Cross-Domain-Policies
        value: none
      - path: /*
        name: Content-Security-Policy
        value: >-
          default-src 'self'; base-uri 'self'; object-src 'none';
          frame-ancestors https://web.telegram.org; form-action 'self'; script-src 'self'
          'unsafe-inline' https://telegram.org; style-src 'self' 'unsafe-inline';
          img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'
          https://pr-agent-r24-staging-api.onrender.com; frame-src 'none';
          media-src 'none'; worker-src 'none'; upgrade-insecure-requests
