projects:
  - name: pr-agent
    environments:
      - name: staging
        services:
          - type: web
            name: pr-agent-staging-api
            runtime: docker
            repo: https://github.com/ARPANPATRA111/PR-Agent
            branch: public-v2
            region: singapore
            plan: starter
            dockerfilePath: ./backend/Dockerfile
            dockerContext: ./backend
            dockerCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
            preDeployCommand: python -m alembic upgrade head
            healthCheckPath: /ready
            maxShutdownDelaySeconds: 60
            autoDeployTrigger: checksPass
            envVars:
              - key: APP_ENV
                value: staging
              - key: APP_BASE_URL
                value: https://pr-agent-staging-api.onrender.com
              - key: FRONTEND_BASE_URL
                value: https://pr-agent-staging-web.onrender.com
              - key: PUBLIC_V2_ENABLED
                value: "false"
              - key: INVITE_ONLY
                value: "true"
              - key: AI_AGENT_ENABLED
                value: "false"
              - key: AI_PROVIDER
                value: disabled
              - key: REMINDER_WORKER_ENABLED
                value: "false"
              - key: MESSAGE_CLEANUP_ENABLED
                value: "false"
              - key: TELEGRAM_BOT_TOKEN
                sync: false
              - key: TELEGRAM_WEBHOOK_SECRET
                generateValue: true
              - key: TELEGRAM_WEBHOOK_URL
                value: https://pr-agent-staging-api.onrender.com/webhook
              - key: TELEGRAM_MINI_APP_URL
                value: https://pr-agent-staging-web.onrender.com
              - key: DATABASE_URL
                sync: false
              - key: SESSION_SIGNING_SECRET
                generateValue: true
              - key: INTERNAL_MONITORING_TOKEN
                generateValue: true
              - key: CORS_ORIGINS
                value: https://pr-agent-staging-web.onrender.com
              - key: NUTRITION_PROVIDER
                value: reference
              - key: DEBUG
                value: "false"
              - key: DISABLE_SSL_VERIFY
                value: "false"
              - key: JSON_LOGS
                value: "true"
              - key: TIMEZONE
                value: Asia/Kolkata

          - type: worker
            name: pr-agent-staging-worker
            runtime: docker
            repo: https://github.com/ARPANPATRA111/PR-Agent
            branch: public-v2
            region: singapore
            plan: starter
            dockerfilePath: ./backend/Dockerfile
            dockerContext: ./backend
            dockerCommand: python worker.py
            maxShutdownDelaySeconds: 60
            autoDeployTrigger: checksPass
            envVars:
              - key: APP_ENV
                value: staging
              - key: APP_BASE_URL
                value: https://pr-agent-staging-api.onrender.com
              - key: FRONTEND_BASE_URL
                value: https://pr-agent-staging-web.onrender.com
              - key: PUBLIC_V2_ENABLED
                value: "false"
              - key: INVITE_ONLY
                value: "true"
              - key: AI_AGENT_ENABLED
                value: "false"
              - key: AI_PROVIDER
                value: disabled
              - key: REMINDER_WORKER_ENABLED
                value: "false"
              - key: MESSAGE_CLEANUP_ENABLED
                value: "false"
              - key: TELEGRAM_BOT_TOKEN
                sync: false
              - key: TELEGRAM_WEBHOOK_SECRET
                generateValue: true
              - key: TELEGRAM_WEBHOOK_URL
                value: https://pr-agent-staging-api.onrender.com/webhook
              - key: TELEGRAM_MINI_APP_URL
                value: https://pr-agent-staging-web.onrender.com
              - key: DATABASE_URL
                sync: false
              - key: SESSION_SIGNING_SECRET
                generateValue: true
              - key: CORS_ORIGINS
                value: https://pr-agent-staging-web.onrender.com
              - key: NUTRITION_PROVIDER
                value: reference
              - key: DEBUG
                value: "false"
              - key: DISABLE_SSL_VERIFY
                value: "false"
              - key: JSON_LOGS
                value: "true"
              - key: TIMEZONE
                value: Asia/Kolkata

          - type: web
            name: pr-agent-staging-web
            runtime: static
            repo: https://github.com/ARPANPATRA111/PR-Agent
            branch: public-v2
            buildCommand: cd frontend && corepack enable && pnpm install --frozen-lockfile && pnpm build
            staticPublishPath: ./frontend/out
            autoDeployTrigger: checksPass
            envVars:
              - key: NEXT_PUBLIC_API_URL
                value: https://pr-agent-staging-api.onrender.com
            routes:
              - type: rewrite
                source: /*
                destination: /index.html
            headers:
              - path: /*
                name: X-Content-Type-Options
                value: nosniff
              - path: /*
                name: Referrer-Policy
                value: no-referrer
              - path: /*
                name: Permissions-Policy
                value: camera=(), geolocation=(), microphone=()
